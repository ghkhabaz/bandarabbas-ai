services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ${BASE44_PROJECT_ROOT:-.}:/app
    ports:
      - "3000:5000"
    environment:
      - PORT=5000
      - FLASK_DEBUG=1
      - PYTHONUNBUFFERED=1
    command: sh -ec "pip install --no-cache-dir -r requirements.txt && exec python app.py"
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:5000/', timeout=5); print('ok')"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 60s
